name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new revision supersedes only the older run for the same branch/PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bigint-benchmark-smoke:
    name: Numeric benchmark checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure opt-in benchmark checks
        run: >-
          cmake --preset benchmarks
          -DNUMFORGE_REQUIRE_NODE_TESTS=ON
      - name: Build numeric harnesses
        run: cmake --build --preset benchmarks --target bigint_arithmetic_benchmark decimal_math_benchmark numeric_root_scan_benchmark matrix_benchmark statistics_benchmark numerical_sampling_benchmark graph_verify_benchmark
      - name: Check exact references and failure contracts
        run: ctest --preset benchmarks -R "^((bigint_arithmetic|decimal_math|numeric_root_scan|matrix|statistics|graph_cache|graph_refinement)_benchmark_smoke|numerical_sampling_(grid|refinement|curve|phase|integral)_smoke)$"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DNUMFORGE_ENABLE_SANITIZERS=ON
          -DNUMFORGE_REQUIRE_NODE_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: cmake -DBUILD_DIR=build -P scripts/run_ci_tests.cmake
      - name: Configure installable package
        run: >-
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DNUMFORGE_BUILD_APPS=OFF
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
      - name: Build and install package
        run: |
          cmake --build build-package --parallel
          cmake --install build-package
      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/package_consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage
          -DNUMFORGE_TEST_CPP=ON
      - name: Test installed package
        run: |
          cmake --build build-consumer --parallel
          ctest --test-dir build-consumer --output-on-failure

  linux-32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gcc-multilib
      - name: Configure 32-bit CMake build
        run: >-
          cmake -S . -B build-32
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_FLAGS=-m32
          -DNUMFORGE_REQUIRE_NODE_TESTS=ON
          -DCMAKE_EXE_LINKER_FLAGS=-m32
      - name: Build 32-bit targets
        run: cmake --build build-32 --parallel
      - name: Test 32-bit targets
        run: cmake -DBUILD_DIR=build-32 -P scripts/run_ci_tests.cmake

  arm64:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - name: macOS ARM64
            runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Configure Release tests
        run: >-
          cmake -S . -B build-arm64
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DNUMFORGE_REQUIRE_NODE_TESTS=ON
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-arm64 --parallel 2
      - name: Test library, CLI and local server
        run: cmake -DBUILD_DIR=build-arm64 -DCONFIGURATION=Release -P scripts/run_ci_tests.cmake
      - name: Configure installable package
        run: >-
          cmake -S . -B build-arm64-package
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DNUMFORGE_BUILD_APPS=OFF
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
      - name: Build and install package
        run: |
          cmake --build build-arm64-package --parallel 2
          cmake --install build-arm64-package
      - name: Configure installed C and C++ consumers
        run: >-
          cmake -S tests/package_consumer -B build-arm64-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage
          -DNUMFORGE_TEST_CPP=ON
      - name: Test installed package
        run: |
          cmake --build build-arm64-consumer --parallel 2
          ctest --test-dir build-arm64-consumer --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure CMake
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DNUMFORGE_REQUIRE_NODE_TESTS=ON
          -DBUILD_TESTING=ON
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 2
      - name: Test
        run: cmake -DBUILD_DIR=build -P scripts/run_ci_tests.cmake
      - name: Configure Release package
        run: >-
          cmake -S . -B build-package -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DNUMFORGE_BUILD_APPS=OFF
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
      - name: Install Release package
        run: |
          cmake --build build-package --config Release --parallel 2 -- /nodeReuse:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build-package --config Release
      - name: Configure C and C++ consumers
        run: >-
          cmake -S tests/package_consumer -B build-consumer -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage -DNUMFORGE_TEST_CPP=ON
      - name: Test Release package
        run: |
          cmake --build build-consumer --config Release --parallel 2 -- /nodeReuse:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-consumer -C Release --output-on-failure

  packages:
    name: Extracted packages (${{ matrix.platform }})
    needs: [linux, windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win-x64
          - runner: ubuntu-22.04
            platform: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and verify development archives
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=$(python -c 'import pathlib,re; print(re.search(r"project\(NumForge\s+VERSION\s+([\d.]+)", pathlib.Path("CMakeLists.txt").read_text()).group(1))')
          version="${version}-dev.${commit:0:12}"
          apps_args=()
          sdk_args=(-DCMAKE_INSTALL_LIBDIR=lib)
          if [[ "$RUNNER_OS" == Windows ]]; then
            apps_args+=(-G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
            sdk_args+=(-G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL)
          fi
          cmake --preset apps -B build/package-apps "${apps_args[@]}"
          cmake --build build/package-apps --config Release --parallel 2
          python scripts/package_apps.py --source . --build build/package-apps --output build/package-apps-check \
            --version "$version" --commit "$commit" --platform "$PACKAGE_PLATFORM"
          cmake --preset sdk -B build/package-sdk "${sdk_args[@]}"
          cmake --build build/package-sdk --config Release --parallel 2
          python scripts/package_sdk.py --source . --support . --build build/package-sdk --output build/package-sdk-check \
            --version "$version" --commit "$commit" --platform "$PACKAGE_PLATFORM"
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "NUMFORGE_WEB_EXECUTABLE=$GITHUB_WORKSPACE/build/package-apps-check/extracted-check/NumForge-$version-$PACKAGE_PLATFORM/numforge_web" >> "$GITHUB_ENV"
          fi
      - name: Install workflow browser dependencies
        if: runner.os == 'Linux'
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check equations and graph handoff from the extracted application
        if: runner.os == 'Linux'
        working-directory: tests/browser
        run: npm test -- equations.spec.js equation-editor.spec.js equation-graph.spec.js equation-scan.spec.js
      - uses: actions/upload-artifact@v7
        with:
          name: development-packages-${{ matrix.platform }}
          path: |
            build/package-*-check/*.zip
            build/package-*-check/*.tar.gz
            build/package-*-check/*.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: package-failure-report-${{ matrix.platform }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure GCC coverage
        run: cmake -S . -B build-coverage -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DNUMFORGE_ENABLE_COVERAGE=ON -DNUMFORGE_REQUIRE_NODE_TESTS=ON -DNUMFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-coverage --parallel 2
      - name: Test
        run: cmake -DBUILD_DIR=build-coverage -DCONFIGURATION=Debug -P scripts/run_ci_tests.cmake
      - name: Collect line and branch coverage
        if: always()
        run: cmake --build build-coverage --target coverage_report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gcc-coverage
          path: build-coverage/coverage/
          if-no-files-found: error
          retention-days: 14

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Clang with sanitizers
        run: cmake -S . -B build-clang -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNUMFORGE_ENABLE_SANITIZERS=ON -DNUMFORGE_REQUIRE_NODE_TESTS=ON -DNUMFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build and test
        run: |
          cmake --build build-clang --parallel 2
          cmake -DBUILD_DIR=build-clang -P scripts/run_ci_tests.cmake
      - name: Build coverage-guided fuzzers
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF -DNUMFORGE_BUILD_FUZZERS=ON -DNUMFORGE_ENABLE_SANITIZERS=ON -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          cmake --build build-fuzz --parallel 2
      - name: Bounded fuzz campaigns
        run: |
          mkdir -p build-fuzz/corpus-parser build-fuzz/corpus-numbers build-fuzz/findings
          build-fuzz/fuzz_parser build-fuzz/corpus-parser -dict=tests/fuzz/numforge.dict -max_total_time=30 -timeout=5 -rss_limit_mb=512 -max_len=256 -artifact_prefix=build-fuzz/findings/
          build-fuzz/fuzz_numbers build-fuzz/corpus-numbers -dict=tests/fuzz/numforge.dict -max_total_time=30 -timeout=5 -rss_limit_mb=512 -max_len=256 -artifact_prefix=build-fuzz/findings/
          mkdir -p build-fuzz/corpus-formatter build-fuzz/corpus-http
          build-fuzz/fuzz_formatter build-fuzz/corpus-formatter -dict=tests/fuzz/numforge.dict -max_total_time=30 -timeout=5 -rss_limit_mb=512 -max_len=256 -artifact_prefix=build-fuzz/findings/
          build-fuzz/fuzz_http build-fuzz/corpus-http -dict=tests/fuzz/http.dict -max_total_time=30 -timeout=5 -rss_limit_mb=512 -max_len=8191 -artifact_prefix=build-fuzz/findings/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-corpora-and-findings
          path: |
            build-fuzz/corpus-*/
            build-fuzz/findings/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Browser checks (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Keep one worker per shard; split the expanded suite without relaxing assertions.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build real server
        run: |
          cmake -S . -B build-browser -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          cmake --build build-browser --target numforge_web --parallel 2
      - name: Install locked test dependencies and Chromium
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test browser against C server
        working-directory: tests/browser
        env:
          NUMFORGE_WEB_EXECUTABLE: ${{ github.workspace }}/build-browser/numforge_web
        run: npm test -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-report-${{ matrix.shard }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 14

  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends doxygen
          python -m pip install -r docs/requirements.txt
      - name: Check source links, staging and navigation
        run: |
          node scripts/check_docs.cjs
          python tests/test_docs.py
      - name: Build strict MkDocs and public Doxygen documentation
        run: python scripts/build_docs.py
      - name: Install library for complete C documentation examples
        run: |
          cmake -S . -B build/docs-sdk -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DNUMFORGE_BUILD_APPS=OFF -DNUMFORGE_WARNINGS_AS_ERRORS=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/docs-sdk-installed
          cmake --build build/docs-sdk --parallel 2
          cmake --install build/docs-sdk
      - name: Compile and run C documentation examples
        run: python scripts/check_doc_examples.py --prefix build/docs-sdk-installed --output build/docs-c-examples

  python-package:
    name: CPython ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2022
            python: '3.12'
          - os: macos-15
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python build tools
        run: python -m pip install "setuptools>=61" wheel
      - name: Build source archive, install wheel and test in isolation
        run: python scripts/check_python_package.py --output build/python-package-check
      - name: Execute documented Python examples against the installed wheel
        run: python scripts/check_doc_examples.py --python-site build/python-package-check/site-packages

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-tidy ninja-build
      - name: Configure production analysis
        run: cmake --preset analysis -DCMAKE_C_COMPILER=clang
      - name: Build with correctness checks
        run: cmake --build --preset analysis
