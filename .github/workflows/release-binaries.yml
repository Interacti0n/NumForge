name: Release applications and SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z or vX.Y.Z-rc.1)
        required: true
        default: v2.1.0
        type: string
      publish:
        description: Attach verified archives to the existing GitHub release
        default: false
        type: boolean
      packages:
        description: Package selection (choose sdk to backfill developer assets)
        type: choice
        options: [all, apps, sdk]
        default: all

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-binaries-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win-x64
          - runner: ubuntu-22.04
            platform: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          path: packaging
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate the requested tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || exit 1
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false
      - name: Build and test exact release source
        shell: bash
        run: |
          set -euo pipefail
          args=(-S source -B build-release -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=ON -DNUMFORGE_BUILD_APPS=ON
            -DNUMFORGE_BUILD_BENCHMARKS=OFF -DNUMFORGE_REQUIRE_NODE_TESTS=ON
            -DNUMFORGE_WARNINGS_AS_ERRORS=ON)
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(-G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
          fi
          cmake "${args[@]}"
          cmake --build build-release --config Release --parallel 2
          ctest --test-dir build-release -C Release --output-on-failure --no-tests=error
      - name: Package and verify extracted applications
        if: ${{ github.event_name == 'release' || inputs.packages != 'sdk' }}
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          args=(-S source -B build-apps -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF -DNUMFORGE_BUILD_APPS=ON
            -DNUMFORGE_BUILD_BENCHMARKS=OFF -DNUMFORGE_WARNINGS_AS_ERRORS=ON)
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(-G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
          fi
          cmake "${args[@]}"
          cmake --build build-apps --config Release --parallel 2
          python packaging/scripts/package_apps.py --source source --build build-apps --output dist \
            --version "${RELEASE_TAG#v}" --commit "$(git -C source rev-parse HEAD)" --platform "$PACKAGE_PLATFORM"
      - name: Package and verify relocated SDK
        if: ${{ github.event_name == 'release' || inputs.packages != 'apps' }}
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          args=(-S source -B build-sdk -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF -DNUMFORGE_BUILD_APPS=OFF
            -DNUMFORGE_BUILD_BENCHMARKS=OFF -DNUMFORGE_WARNINGS_AS_ERRORS=ON
            -DCMAKE_INSTALL_LIBDIR=lib)
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(-G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL)
          fi
          cmake "${args[@]}"
          cmake --build build-sdk --config Release --parallel 2
          python packaging/scripts/package_sdk.py --source source --build build-sdk --support packaging --output sdk-dist \
            --version "${RELEASE_TAG#v}" --commit "$(git -C source rev-parse HEAD)" --platform "$PACKAGE_PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            sdk-dist/*.zip
            sdk-dist/*.tar.gz
            sdk-dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    if: ${{ github.event_name == 'release' || inputs.publish }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and attach to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check -- *.sha256
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" -- *.zip *.tar.gz *.sha256
