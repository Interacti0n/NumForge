name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DNUMFORGE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
