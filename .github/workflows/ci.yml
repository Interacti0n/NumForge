name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DNUMFORGE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
      - name: Configure installable package
        run: >-
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
      - name: Build and install package
        run: |
          cmake --build build-package --parallel
          cmake --install build-package
      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/package_consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage
      - name: Test installed package
        run: |
          cmake --build build-consumer --parallel
          ctest --test-dir build-consumer --output-on-failure

  linux-32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gcc-multilib
      - name: Configure 32-bit CMake build
        run: >-
          cmake -S . -B build-32
          -DBUILD_TESTING=ON
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_EXE_LINKER_FLAGS=-m32
      - name: Build 32-bit targets
        run: cmake --build build-32 --parallel
      - name: Test 32-bit targets
        run: ctest --test-dir build-32 --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure CMake
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DNUMFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
