name: Python adapter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: CPython ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2022
            python: '3.12'
          - os: macos-15
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python build tools
        run: python -m pip install "setuptools>=61" wheel
      - name: Build source archive, install wheel and test in isolation
        run: python scripts/check_python_package.py --output build/python-package-check
      - name: Execute documented Python examples against the installed wheel
        run: python scripts/check_doc_examples.py --python-site build/python-package-check/site-packages
